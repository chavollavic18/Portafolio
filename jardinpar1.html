<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Virtual - Árboles en Tierra</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1922, #1d3b2a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .garden-container {
            background: #2d4a33;
            padding: 25px;
            border-radius: 50px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.7);
            border: 3px solid #6f9e7a;
        }

        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            border-radius: 40px;
            box-shadow: inset 0 0 80px rgba(0,30,0,0.6);
        }

        .control-panel {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            color: #e2f0d6;
            background: #1e3f28;
            padding: 15px 30px;
            border-radius: 60px;
            border: 2px solid #7fb078;
        }

        .time-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #2d5530;
            padding: 8px 20px;
            border-radius: 40px;
        }

        #timeSlider {
            width: 250px;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #ffd966, #2c5e8c);
            border-radius: 10px;
            outline: none;
        }

        #timeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #fff7b0;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid #ffae42;
            box-shadow: 0 0 20px #ffbb33;
        }

        .stats-grid {
            display: flex;
            gap: 30px;
            background: #2d5530;
            padding: 8px 25px;
            border-radius: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .stat-label {
            font-size: 11px;
            color: #b8d9aa;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #f5ffe0;
        }

        .season-indicator {
            display: flex;
            gap: 15px;
            background: #2d5530;
            padding: 8px 20px;
            border-radius: 40px;
        }

        .season-btn {
            background: none;
            border: none;
            color: #c9e0b5;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 30px;
            transition: all 0.3s;
        }

        .season-btn.active {
            background: #4d854d;
            color: #fffac2;
            transform: scale(1.1);
            box-shadow: 0 0 20px #8bc34a;
        }

        h2 {
            text-align: center;
            color: #ebffe0;
            margin: 0 0 15px 0;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0,20,0,0.8);
        }
    </style>
</head>
<body>
    <div class="garden-container">
        <h2>🌳 JARDÍN CON ÁRBOLES ENRAIZADOS 🌳</h2>
        <canvas id="gardenCanvas" width="1000" height="600"></canvas>
        
        <div class="control-panel">
            <div class="time-control">
                <span>☀️</span>
                <input type="range" id="timeSlider" min="0" max="100" value="70">
                <span>🌙</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Temperatura</span>
                    <span class="stat-value" id="tempValue">24°C</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Humedad</span>
                    <span class="stat-value" id="humidityValue">58%</span>
                </div>
            </div>

            <div class="season-indicator">
                <button class="season-btn active" id="springBtn">🌸</button>
                <button class="season-btn" id="summerBtn">☀️</button>
                <button class="season-btn" id="autumnBtn">🍂</button>
                <button class="season-btn" id="winterBtn">❄️</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');
        const timeSlider = document.getElementById('timeSlider');
        const tempValue = document.getElementById('tempValue');
        const humidityValue = document.getElementById('humidityValue');

        // Variables de entorno
        let timeOfDay = 70;
        let season = 'spring';

        // Elementos del jardín - ÁRBOLES CORREGIDOS (y más bajos)
        const trees = [
            { x: 150, y: 480, size: 45 },  // y más grande = más abajo
            { x: 280, y: 450, size: 55 },
            { x: 400, y: 520, size: 40 },
            { x: 520, y: 470, size: 50 },
            { x: 620, y: 530, size: 38 },
            { x: 730, y: 490, size: 48 },
            { x: 820, y: 510, size: 42 },
            { x: 920, y: 460, size: 52 }
        ];

        // Piedras
        const stones = [];
        for (let i = 0; i < 10; i++) {
            stones.push({
                x: 50 + Math.random() * 900,
                y: 450 + Math.random() * 120,
                size: 15 + Math.random() * 25
            });
        }

        // Flores
        const flowers = [];
        for (let i = 0; i < 20; i++) {
            flowers.push({
                x: 100 + Math.random() * 800,
                y: 480 + Math.random() * 100,
                color: `hsl(${Math.random() * 60 + 300}, 70%, 60%)`
            });
        }

        // Arroyo
        const streamPoints = [
            { x: 50, y: 550 }, { x: 150, y: 540 }, { x: 250, y: 530 },
            { x: 350, y: 525 }, { x: 450, y: 520 }, { x: 550, y: 515 },
            { x: 650, y: 510 }, { x: 750, y: 505 }, { x: 850, y: 500 },
            { x: 950, y: 495 }
        ];

        function interpolateColor(color1, color2, factor) {
            const r1 = parseInt(color1.slice(1,3), 16);
            const g1 = parseInt(color1.slice(3,5), 16);
            const b1 = parseInt(color1.slice(5,7), 16);
            
            const r2 = parseInt(color2.slice(1,3), 16);
            const g2 = parseInt(color2.slice(3,5), 16);
            const b2 = parseInt(color2.slice(5,7), 16);
            
            const r = Math.round(r1 + (r2 - r1) * factor);
            const g = Math.round(g1 + (g2 - g1) * factor);
            const b = Math.round(b1 + (b2 - b1) * factor);
            
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        function updateEnvironment() {
            timeOfDay = timeSlider.value;
            const brightness = timeOfDay / 100;
            
            let baseTemp = 20;
            if (season === 'summer') baseTemp = 32;
            else if (season === 'autumn') baseTemp = 18;
            else if (season === 'winter') baseTemp = 8;
            
            const temp = baseTemp + (brightness - 0.5) * 10;
            tempValue.textContent = Math.round(temp) + '°C';
            
            const humidity = season === 'summer' ? 45 : season === 'winter' ? 75 : 60;
            humidityValue.textContent = Math.round(humidity + (Math.random() * 10 - 5)) + '%';
        }

        function drawSky() {
            const brightness = timeOfDay / 100;
            
            const skyColors = {
                spring: { top: '#87CEEB', bottom: '#E0F6FF' },
                summer: { top: '#4CB5F2', bottom: '#FFE68F' },
                autumn: { top: '#89A9C4', bottom: '#F4C542' },
                winter: { top: '#B0D0E0', bottom: '#D6EAF8' }
            };
            
            const colors = skyColors[season];
            const topColor = interpolateColor('#0B1F2E', colors.top, brightness);
            const bottomColor = interpolateColor('#1C3B4F', colors.bottom, brightness);
            
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, topColor);
            gradient.addColorStop(1, bottomColor);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sol o luna
            if (brightness > 0.5) {
                ctx.beginPath();
                ctx.arc(850, 90, 50, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 100, ${brightness})`;
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(850, 90, 35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 240, 210, ${1 - brightness})`;
                ctx.fill();
            }
        }

        function drawGround() {
            const brightness = timeOfDay / 100;
            
            // LÍNEA DEL HORIZONTE - Todo lo que está debajo de y=400 es tierra
            const groundLevel = 400;
            
            // Suelo (desde groundLevel hasta abajo)
            const groundGradient = ctx.createLinearGradient(0, groundLevel, 0, canvas.height);
            
            if (season === 'spring') {
                groundGradient.addColorStop(0, interpolateColor('#3d8c40', '#6fbf70', brightness));
                groundGradient.addColorStop(1, interpolateColor('#2d6a30', '#4f8f50', brightness));
            } else if (season === 'summer') {
                groundGradient.addColorStop(0, interpolateColor('#8cb06b', '#c4d9a3', brightness));
                groundGradient.addColorStop(1, interpolateColor('#6d8f4f', '#9fb87f', brightness));
            } else if (season === 'autumn') {
                groundGradient.addColorStop(0, interpolateColor('#b58f4f', '#d9b37b', brightness));
                groundGradient.addColorStop(1, interpolateColor('#8f6f3d', '#b59463', brightness));
            } else {
                groundGradient.addColorStop(0, interpolateColor('#acc0c4', '#d0e0e4', brightness));
                groundGradient.addColorStop(1, interpolateColor('#85999e', '#a9b9be', brightness));
            }
            
            ctx.fillStyle = groundGradient;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel - 30); // Pequeña variación
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();
            
            // Textura del suelo
            ctx.fillStyle = `rgba(50, 60, 30, ${0.2})`;
            for (let i = 0; i < 100; i++) {
                ctx.beginPath();
                ctx.arc(20 + i * 30, 480 + Math.sin(i) * 15, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawTrees() {
            const brightness = timeOfDay / 100;
            
            trees.forEach(tree => {
                // RAÍCES (para que se vea enterrado)
                ctx.fillStyle = interpolateColor('#5a3f2c', '#7a5f4c', brightness);
                ctx.beginPath();
                ctx.ellipse(tree.x, tree.y + 10, tree.size/3, tree.size/6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Pequeñas raíces visibles
                ctx.strokeStyle = '#5a3f2c';
                ctx.lineWidth = 3;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(tree.x - 8 + i*8, tree.y + 5);
                    ctx.lineTo(tree.x - 15 + i*8, tree.y + 20);
                    ctx.stroke();
                }
                
                // TRONCO - AHORA BIEN ENTERRADO
                ctx.fillStyle = interpolateColor('#6b4f3c', '#8b6f5c', brightness);
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 3;
                
                // Tronco principal (desde el suelo hacia arriba)
                ctx.fillRect(tree.x - 10, tree.y - 50, 20, 60);
                
                // Copa del árbol (hojas)
                ctx.shadowBlur = 15;
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const dx = Math.cos(angle) * 25;
                    const dy = Math.sin(angle) * 20 - 10;
                    
                    let leafColor;
                    if (season === 'spring') leafColor = '#4fbf4f';
                    else if (season === 'summer') leafColor = '#2f9f2f';
                    else if (season === 'autumn') leafColor = '#cf7f2f';
                    else leafColor = '#afbfcf';
                    
                    ctx.beginPath();
                    ctx.arc(tree.x + dx, tree.y - 40 + dy, 18, 0, Math.PI * 2);
                    ctx.fillStyle = interpolateColor(leafColor, '#ffffff', brightness * 0.2);
                    ctx.fill();
                }
                
                // Sombra del árbol en el suelo
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(tree.x, tree.y + 15, 30, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawStream() {
            ctx.beginPath();
            ctx.moveTo(streamPoints[0].x, streamPoints[0].y);
            
            for (let i = 1; i < streamPoints.length; i++) {
                const xc = (streamPoints[i].x + streamPoints[i-1].x) / 2;
                const yc = (streamPoints[i].y + streamPoints[i-1].y) / 2;
                ctx.quadraticCurveTo(streamPoints[i-1].x, streamPoints[i-1].y, xc, yc);
            }
            
            ctx.strokeStyle = '#4aa0c0';
            ctx.lineWidth = 20;
            ctx.stroke();
        }

        function drawFlowers() {
            if (season === 'winter') return;
            
            flowers.forEach(flower => {
                // Tallo
                ctx.beginPath();
                ctx.moveTo(flower.x, flower.y);
                ctx.lineTo(flower.x, flower.y - 15);
                ctx.strokeStyle = '#3f9f3f';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Flor
                ctx.beginPath();
                ctx.arc(flower.x, flower.y - 20, 6, 0, Math.PI * 2);
                ctx.fillStyle = flower.color;
                ctx.fill();
                
                // Centro
                ctx.beginPath();
                ctx.arc(flower.x, flower.y - 20, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fffa8f';
                ctx.fill();
            });
        }

        function drawStones() {
            stones.forEach(stone => {
                const gradient = ctx.createRadialGradient(stone.x - 5, stone.y - 5, 5, stone.x, stone.y, stone.size);
                gradient.addColorStop(0, '#b0b0b0');
                gradient.addColorStop(1, '#505050');
                
                ctx.beginPath();
                ctx.ellipse(stone.x, stone.y, stone.size/2, stone.size/3, 0, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.shadowColor = '#00000080';
                ctx.shadowBlur = 5;
                ctx.fill();
            });
        }

        function drawGarden() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'transparent';
            
            drawSky();
            drawGround();
            drawStream();
            drawStones();
            drawFlowers();
            drawTrees(); // Árboles DIBUJADOS DESPUÉS de las flores/piedras para que se vean encima
            
            ctx.shadowColor = 'transparent';
        }

        // Event listeners
        timeSlider.addEventListener('input', () => {
            updateEnvironment();
            drawGarden();
        });

        document.getElementById('springBtn').addEventListener('click', () => {
            season = 'spring';
            document.querySelectorAll('.season-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('springBtn').classList.add('active');
            updateEnvironment();
            drawGarden();
        });

        document.getElementById('summerBtn').addEventListener('click', () => {
            season = 'summer';
            document.querySelectorAll('.season-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('summerBtn').classList.add('active');
            updateEnvironment();
            drawGarden();
        });

        document.getElementById('autumnBtn').addEventListener('click', () => {
            season = 'autumn';
            document.querySelectorAll('.season-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('autumnBtn').classList.add('active');
            updateEnvironment();
            drawGarden();
        });

        document.getElementById('winterBtn').addEventListener('click', () => {
            season = 'winter';
            document.querySelectorAll('.season-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('winterBtn').classList.add('active');
            updateEnvironment();
            drawGarden();
        });

        // Inicializar
        updateEnvironment();
        drawGarden();

        // Animación suave
        function animate() {
            drawGarden();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>

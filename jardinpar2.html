<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Evolutivo - Lago Realista con Peces</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 25px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            z-index: 100;
            border: 2px solid #ffaa33;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #texture-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,40,0,0.9);
            color: #aaffaa;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            border: 2px solid #8bc34a;
            z-index: 100;
            backdrop-filter: blur(5px);
            display: flex;
            gap: 15px;
        }
        
        .texture-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        
        .dot-ok { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .dot-loading { background-color: #ffff00; box-shadow: 0 0 10px #ffff00; }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20, 30, 20, 0.8);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid #8bc34a;
            z-index: 100;
        }
        
        .season-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 30px;
            transition: all 0.2s;
            text-shadow: 0 2px 5px black;
        }
        
        .season-btn.active {
            background: #6ba86b;
            transform: scale(1.1);
            box-shadow: 0 0 20px #a5d6a5;
        }
        
        #time-slider-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 2px solid #ffaa33;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }
        
        #timeSlider {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #ffaa00, #2a4a7a);
            border-radius: 5px;
            outline: none;
        }
        
        #timeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ffffaa;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ff8800;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            right: 250px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 2px solid #8bc34a;
            z-index: 100;
            display: flex;
            gap: 20px;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            font-size: 10px;
            color: #c0e0a0;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffffaa;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,40,0,0.95);
            padding: 30px 60px;
            border-radius: 60px;
            font-size: 24px;
            border: 3px solid #8bc34a;
            z-index: 200;
            transition: opacity 0.5s;
            text-align: center;
            box-shadow: 0 0 100px #8bc34a;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        #loading small {
            font-size: 14px;
            color: #aaffaa;
            display: block;
            margin-top: 10px;
        }
        
        .fish-counter {
            position: absolute;
            bottom: 100px;
            right: 20px;
            background: rgba(0,40,80,0.8);
            color: #aaddff;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 14px;
            border: 2px solid #44aaff;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">
        🌱 CARGANDO JARDÍN COMPLETO 🌱
        <small id="loading-text">Cargando texturas y efectos...</small>
    </div>
    
    <div id="info">
        <span>🌿 JARDÍN COMPLETO | LAGO CON PECES | PUENTE CON ESCALERAS | 12 BANCAS</span>
    </div>
    
    <div id="texture-status">
        <span><span class="texture-dot" id="dot-madera"></span> Madera</span>
        <span><span class="texture-dot" id="dot-sakura"></span> Sakura</span>
        <span><span class="texture-dot" id="dot-verde"></span> Árbol</span>
        <span><span class="texture-dot" id="dot-pasto"></span> Pasto</span>
    </div>
    
    <div id="stats">
        <div class="stat">
            <span class="stat-label">ESTACIÓN</span>
            <span class="stat-value" id="seasonEmoji">🌸</span>
        </div>
        <div class="stat">
            <span class="stat-label">PECES</span>
            <span class="stat-value" id="fishCount">20</span>
        </div>
    </div>
    
    <div id="time-slider-container">
        <span>☀️</span>
        <input type="range" id="timeSlider" min="0" max="100" value="70">
        <span>🌙</span>
    </div>
    
    <div id="controls">
        <button class="season-btn active" id="springBtn">🌸 Primavera</button>
        <button class="season-btn" id="summerBtn">☀️ Verano</button>
        <button class="season-btn" id="autumnBtn">🍂 Otoño</button>
        <button class="season-btn" id="winterBtn">❄️ Invierno</button>
    </div>
    
    <div class="fish-counter">🐟 PECES NADANDO: <span id="fishCountDisplay">20</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== CONFIGURACIÓN INICIAL ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 20, 45);
        camera.lookAt(0, 2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==================== CONTROLES SIMPLES ====================
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let zoom = 40;
        
        document.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                targetRotationY += (e.movementX * 0.005);
                targetRotationX += (e.movementY * 0.005);
                targetRotationX = Math.max(-0.5, Math.min(0.8, targetRotationX));
            }
        });
        
        document.addEventListener('wheel', (e) => {
            zoom += e.deltaY * 0.01;
            zoom = Math.max(20, Math.min(80, zoom));
        });

        // ==================== LUCES ====================
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(30, 30, 20);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
        fillLight.position.set(-20, 10, -20);
        scene.add(fillLight);

        // ==================== ESTADO DE TEXTURAS ====================
        const textureStatus = {
            madera: false,
            sakura: false,
            arbolverde: false,
            pasto: false
        };
        
        function updateTextureStatus() {
            document.getElementById('dot-madera').className = 'texture-dot ' + (textureStatus.madera ? 'dot-ok' : 'dot-loading');
            document.getElementById('dot-sakura').className = 'texture-dot ' + (textureStatus.sakura ? 'dot-ok' : 'dot-loading');
            document.getElementById('dot-verde').className = 'texture-dot ' + (textureStatus.arbolverde ? 'dot-ok' : 'dot-loading');
            document.getElementById('dot-pasto').className = 'texture-dot ' + (textureStatus.pasto ? 'dot-ok' : 'dot-loading');
            
            const count = Object.values(textureStatus).filter(v => v).length;
            
            if (count === 4) {
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                }, 500);
            }
        }

        // ==================== CARGAR TEXTURAS ====================
        const loader = new THREE.TextureLoader();
        
        // Cargar texturas
        const maderaTex = loader.load('madera.jpg', 
            () => { textureStatus.madera = true; updateTextureStatus(); },
            undefined,
            () => { textureStatus.madera = true; updateTextureStatus(); }
        );
        
        const sakuraTex = loader.load('sakura.jpg',
            () => { textureStatus.sakura = true; updateTextureStatus(); },
            undefined,
            () => { textureStatus.sakura = true; updateTextureStatus(); }
        );
        
        const arbolVerdeTex = loader.load('arbolverde.jpg',
            () => { textureStatus.arbolverde = true; updateTextureStatus(); },
            undefined,
            () => { textureStatus.arbolverde = true; updateTextureStatus(); }
        );
        
        const pastoTex = loader.load('pasto.jpg',
            () => { textureStatus.pasto = true; updateTextureStatus(); },
            undefined,
            () => { textureStatus.pasto = true; updateTextureStatus(); }
        );

        // Configurar repetición de textura de pasto
        pastoTex.wrapS = THREE.RepeatWrapping;
        pastoTex.wrapT = THREE.RepeatWrapping;
        pastoTex.repeat.set(6, 6);

        // ==================== SUELO CON TEXTURA DE PASTO ====================
        const groundGeo = new THREE.CircleGeometry(100, 128);
        const groundMat = new THREE.MeshStandardMaterial({ 
            map: pastoTex,
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==================== LAGO HIPERREALISTA ====================
        // Fondo del lago con textura de arena
        const lakeBedGeo = new THREE.CylinderGeometry(18, 18, 0.3, 128);
        const lakeBedMat = new THREE.MeshStandardMaterial({ 
            color: 0xcc9966,
            roughness: 0.9,
            emissive: 0x332211,
            emissiveIntensity: 0.2
        });
        const lakeBed = new THREE.Mesh(lakeBedGeo, lakeBedMat);
        lakeBed.position.set(0, -0.3, 0);
        lakeBed.receiveShadow = true;
        scene.add(lakeBed);

        // Agua principal con efecto de profundidad
        const waterGeo = new THREE.CylinderGeometry(17.5, 17.5, 0.6, 128);
        
        // Crear textura procedural para el agua
        const waterCanvas = document.createElement('canvas');
        waterCanvas.width = 512;
        waterCanvas.height = 512;
        const ctx = waterCanvas.getContext('2d');
        
        // Patrón de ondas
        ctx.fillStyle = '#3399ff';
        ctx.fillRect(0, 0, 512, 512);
        
        for (let i = 0; i < 200; i++) {
            ctx.strokeStyle = `rgba(255,255,255,${0.1 + Math.random()*0.2})`;
            ctx.lineWidth = 1 + Math.random() * 3;
            ctx.beginPath();
            ctx.arc(256 + (Math.random()-0.5)*200, 256 + (Math.random()-0.5)*200, 50 + Math.random()*100, 0, Math.PI*2);
            ctx.stroke();
        }
        
        const waterTexture = new THREE.CanvasTexture(waterCanvas);
        
        const waterMat = new THREE.MeshStandardMaterial({
            map: waterTexture,
            color: 0x44aaff,
            transparent: true,
            opacity: 0.8,
            emissive: 0x113366,
            roughness: 0.2,
            metalness: 0.3,
            emissiveIntensity: 0.3
        });
        
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(0, 0.1, 0);
        water.receiveShadow = true;
        scene.add(water);

        // Capa de ondas superficiales
        const rippleGeo = new THREE.CylinderGeometry(17.8, 17.8, 0.1, 128);
        const rippleMat = new THREE.MeshStandardMaterial({
            color: 0xaaddff,
            transparent: true,
            opacity: 0.4,
            emissive: 0x224488
        });
        const ripple = new THREE.Mesh(rippleGeo, rippleMat);
        ripple.position.set(0, 0.3, 0);
        scene.add(ripple);

        // Reflejos de luz en el agua (partículas brillantes)
        for (let i = 0; i < 30; i++) {
            const ang = Math.random() * Math.PI * 2;
            const radio = 5 + Math.random() * 10;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const brilloGeo = new THREE.SphereGeometry(0.1, 4);
            const brilloMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x4488ff,
                emissiveIntensity: 2
            });
            const brillo = new THREE.Mesh(brilloGeo, brilloMat);
            brillo.position.set(x, 0.4, z);
            scene.add(brillo);
        }

        // ==================== PECES (20) ====================
        const peces = [];
        
        function crearPez(posX, posY, posZ, color) {
            const grupo = new THREE.Group();
            
            // Cuerpo principal
            const cuerpoGeo = new THREE.SphereGeometry(0.35, 10);
            const cuerpoMat = new THREE.MeshStandardMaterial({ 
                color: color,
                emissive: 0x331100,
                roughness: 0.3,
                metalness: 0.2
            });
            const cuerpo = new THREE.Mesh(cuerpoGeo, cuerpoMat);
            cuerpo.scale.set(1.4, 0.6, 0.8);
            cuerpo.castShadow = true;
            cuerpo.receiveShadow = true;
            grupo.add(cuerpo);
            
            // Cabeza
            const cabezaGeo = new THREE.SphereGeometry(0.2, 8);
            const cabezaMat = new THREE.MeshStandardMaterial({ color: color });
            const cabeza = new THREE.Mesh(cabezaGeo, cabezaMat);
            cabeza.position.set(0.35, 0.05, 0);
            cabeza.scale.set(0.8, 0.7, 0.7);
            grupo.add(cabeza);
            
            // Ojos
            const ojoGeo = new THREE.SphereGeometry(0.05, 6);
            const ojoMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const ojo1 = new THREE.Mesh(ojoGeo, ojoMat);
            ojo1.position.set(0.45, 0.1, 0.12);
            grupo.add(ojo1);
            
            const ojo2 = new THREE.Mesh(ojoGeo, ojoMat);
            ojo2.position.set(0.45, 0.1, -0.12);
            grupo.add(ojo2);
            
            // Aletas
            const aletaGeo = new THREE.ConeGeometry(0.12, 0.25, 4);
            const aletaMat = new THREE.MeshStandardMaterial({ color: color });
            
            const aletaDorsal = new THREE.Mesh(aletaGeo, aletaMat);
            aletaDorsal.position.set(-0.1, 0.2, 0);
            aletaDorsal.rotation.x = Math.PI / 2;
            aletaDorsal.rotation.z = Math.PI / 2;
            grupo.add(aletaDorsal);
            
            const aletaLateral1 = new THREE.Mesh(aletaGeo, aletaMat);
            aletaLateral1.position.set(0.1, 0.05, 0.25);
            aletaLateral1.rotation.y = -0.3;
            grupo.add(aletaLateral1);
            
            const aletaLateral2 = new THREE.Mesh(aletaGeo, aletaMat);
            aletaLateral2.position.set(0.1, 0.05, -0.25);
            aletaLateral2.rotation.y = 0.3;
            grupo.add(aletaLateral2);
            
            // Cola
            const colaGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
            const colaMat = new THREE.MeshStandardMaterial({ color: color });
            const cola = new THREE.Mesh(colaGeo, colaMat);
            cola.position.set(-0.45, 0.05, 0);
            cola.rotation.x = Math.PI / 2;
            cola.rotation.z = Math.PI / 2;
            grupo.add(cola);
            
            grupo.position.set(posX, posY, posZ);
            
            // Datos para animación
            grupo.userData = {
                velocidad: 0.008 + Math.random() * 0.015,
                direccion: Math.random() * Math.PI * 2,
                cambioDireccion: 0,
                offsetY: posY,
                amplitud: 0.1 + Math.random() * 0.2,
                frecuencia: 1 + Math.random() * 2
            };
            
            return grupo;
        }

        // Crear banco de peces
        const coloresPeces = [0xffaa33, 0xff6633, 0xff8833, 0xff4433, 0xffaa00];
        for (let i = 0; i < 20; i++) {
            const angulo = Math.random() * Math.PI * 2;
            const radio = 2 + Math.random() * 12;
            const x = Math.cos(angulo) * radio;
            const z = Math.sin(angulo) * radio;
            const y = 0.1 + Math.random() * 0.8;
            
            const color = coloresPeces[Math.floor(Math.random() * coloresPeces.length)];
            const pez = crearPez(x, y, z, color);
            scene.add(pez);
            peces.push(pez);
        }

        // ==================== PUENTE CON ESCALERAS ====================
        function crearPuenteConEscaleras() {
            const grupo = new THREE.Group();
            const largo = 30;
            const ancho = 4;
            
            // Pilares del puente
            for (let i = -largo/2; i <= largo/2; i += 3) {
                const pilarGeo = new THREE.BoxGeometry(1, 3, 1.5);
                const pilarMat = new THREE.MeshStandardMaterial({ map: maderaTex, color: 0xccaa88 });
                const pilar = new THREE.Mesh(pilarGeo, pilarMat);
                pilar.position.set(i, 1.5, 0);
                pilar.castShadow = true;
                pilar.receiveShadow = true;
                grupo.add(pilar);
            }
            
            // Base del puente
            for (let i = -largo/2; i <= largo/2; i += 0.6) {
                const tablonGeo = new THREE.BoxGeometry(0.5, 0.2, ancho);
                const tablonMat = new THREE.MeshStandardMaterial({ map: maderaTex, color: 0xccaa88 });
                const tablon = new THREE.Mesh(tablonGeo, tablonMat);
                tablon.position.set(i, 2.2, 0);
                tablon.castShadow = true;
                tablon.receiveShadow = true;
                grupo.add(tablon);
            }
            
            // Barandales
            for (let lado = -1; lado <= 1; lado += 2) {
                const ladoPos = lado * (ancho/2 + 0.4);
                
                // Postes
                for (let i = -largo/2; i <= largo/2; i += 1.5) {
                    const posteGeo = new THREE.BoxGeometry(0.25, 1.5, 0.25);
                    const posteMat = new THREE.MeshStandardMaterial({ map: maderaTex });
                    const poste = new THREE.Mesh(posteGeo, posteMat);
                    poste.position.set(i, 2.9, ladoPos);
                    poste.castShadow = true;
                    poste.receiveShadow = true;
                    grupo.add(poste);
                }
                
                // Barandas
                for (let h = 0; h < 2; h++) {
                    const barraGeo = new THREE.BoxGeometry(largo + 1, 0.15, 0.15);
                    const barraMat = new THREE.MeshStandardMaterial({ map: maderaTex });
                    const barra = new THREE.Mesh(barraGeo, barraMat);
                    barra.position.set(0, 3.2 + h * 0.4, ladoPos);
                    barra.castShadow = true;
                    barra.receiveShadow = true;
                    grupo.add(barra);
                }
            }
            
            // ESCALERAS DE ACCESO (izquierda y derecha)
            for (let lado = -1; lado <= 1; lado += 2) {
                const escaleras = new THREE.Group();
                const startX = lado * (largo/2 + 2);
                const direction = lado;
                
                for (let i = 0; i < 5; i++) {
                    // Peldaños
                    const peldañoGeo = new THREE.BoxGeometry(1.2, 0.2, ancho);
                    const peldañoMat = new THREE.MeshStandardMaterial({ map: maderaTex, color: 0xccaa88 });
                    const peldaño = new THREE.Mesh(peldañoGeo, peldañoMat);
                    peldaño.position.set(startX + direction * i * 1.2, 0.5 + i * 0.4, 0);
                    peldaño.castShadow = true;
                    peldaño.receiveShadow = true;
                    escaleras.add(peldaño);
                    
                    // Barandales de escaleras
                    if (i === 4) {
                        for (let ladoBar = -1; ladoBar <= 1; ladoBar += 2) {
                            const posteGeo = new THREE.BoxGeometry(0.2, 1.2, 0.2);
                            const posteMat = new THREE.MeshStandardMaterial({ map: maderaTex });
                            const poste = new THREE.Mesh(posteGeo, posteMat);
                            poste.position.set(startX + direction * i * 1.2, 1.2, ladoBar * (ancho/2 + 0.3));
                            poste.castShadow = true;
                            escaleras.add(poste);
                        }
                    }
                }
                
                grupo.add(escaleras);
            }
            
            grupo.position.set(0, 0, 0);
            scene.add(grupo);
        }
        
        crearPuenteConEscaleras();

        // ==================== BANCAS (12) ALREDEDOR DEL LAGO ====================
        function crearBancas() {
            const posiciones = [
                { x: 14, z: 10, rot: -0.5 },
                { x: 16, z: 2, rot: 1.0 },
                { x: 14, z: -8, rot: 1.8 },
                { x: 8, z: -16, rot: 2.3 },
                { x: -2, z: -18, rot: 3.0 },
                { x: -12, z: -15, rot: -2.2 },
                { x: -18, z: -5, rot: -1.8 },
                { x: -19, z: 5, rot: -1.2 },
                { x: -15, z: 14, rot: -0.3 },
                { x: -5, z: 19, rot: 0.4 },
                { x: 5, z: 19, rot: 0.8 },
                { x: 15, z: 15, rot: 1.2 }
            ];
            
            posiciones.forEach(pos => {
                const grupo = new THREE.Group();
                
                // Asiento
                const asientoGeo = new THREE.BoxGeometry(2.5, 0.15, 1.0);
                const asientoMat = new THREE.MeshStandardMaterial({ map: maderaTex, color: 0xccaa88 });
                const asiento = new THREE.Mesh(asientoGeo, asientoMat);
                asiento.position.y = 0.5;
                asiento.castShadow = true;
                asiento.receiveShadow = true;
                grupo.add(asiento);
                
                // Respaldo
                const respaldoGeo = new THREE.BoxGeometry(2.5, 1.0, 0.15);
                const respaldoMat = new THREE.MeshStandardMaterial({ map: maderaTex, color: 0xccaa88 });
                const respaldo = new THREE.Mesh(respaldoGeo, respaldoMat);
                respaldo.position.set(0, 1.0, -0.4);
                respaldo.castShadow = true;
                respaldo.receiveShadow = true;
                grupo.add(respaldo);
                
                // Patas
                for (let i = 0; i < 4; i++) {
                    const pataGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
                    const pataMat = new THREE.MeshStandardMaterial({ map: maderaTex });
                    const pata = new THREE.Mesh(pataGeo, pataMat);
                    pata.position.set(i < 2 ? -1.0 : 1.0, 0.25, i % 2 === 0 ? -0.35 : 0.35);
                    pata.castShadow = true;
                    pata.receiveShadow = true;
                    grupo.add(pata);
                }
                
                // Apoya brazos
                for (let lado = -1; lado <= 1; lado += 2) {
                    const brazoGeo = new THREE.BoxGeometry(0.15, 0.7, 1.0);
                    const brazoMat = new THREE.MeshStandardMaterial({ map: maderaTex });
                    const brazo = new THREE.Mesh(brazoGeo, brazoMat);
                    brazo.position.set(lado * 1.25, 0.9, 0);
                    brazo.castShadow = true;
                    brazo.receiveShadow = true;
                    grupo.add(brazo);
                }
                
                grupo.position.set(pos.x, 0.2, pos.z);
                grupo.rotation.y = pos.rot;
                scene.add(grupo);
            });
        }
        
        crearBancas();

        // ==================== CLASE PLANTA CON TEXTURAS ====================
        class PlantaConTexturas {
            constructor(tipo, x, z, texturaMadera, texturaHoja) {
                this.tipo = tipo;
                this.x = x;
                this.z = z;
                this.edad = Math.random();
                this.velocidad = 0.06 + Math.random() * 0.1;
                this.mesh = new THREE.Group();
                this.texturaMadera = texturaMadera;
                this.texturaHoja = texturaHoja;
                this.crear();
            }
            
            crear() {
                const altura = 2 + Math.random() * 3;
                
                // Tronco
                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, altura, 8);
                const trunkMat = new THREE.MeshStandardMaterial({ 
                    map: this.texturaMadera,
                    roughness: 0.7
                });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = altura / 2;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                this.mesh.add(trunk);
                
                // Copa
                let texturaCopa;
                if (this.tipo === 'sakura') {
                    texturaCopa = sakuraTex;
                } else {
                    texturaCopa = arbolVerdeTex;
                }
                
                const copaGeo = new THREE.SphereGeometry(1.1, 7);
                const copaMat = new THREE.MeshStandardMaterial({ 
                    map: texturaCopa,
                    roughness: 0.4
                });
                this.copa = new THREE.Mesh(copaGeo, copaMat);
                this.copa.position.y = altura + 0.3;
                this.copa.castShadow = true;
                this.copa.receiveShadow = true;
                this.mesh.add(this.copa);
                
                // Ramas
                for (let i = 0; i < 3; i++) {
                    const ramaGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.8);
                    const ramaMat = new THREE.MeshStandardMaterial({ map: this.texturaMadera });
                    const rama = new THREE.Mesh(ramaGeo, ramaMat);
                    const ang = (i / 3) * Math.PI * 2;
                    rama.position.set(Math.cos(ang)*0.4, altura-0.5, Math.sin(ang)*0.4);
                    rama.rotation.z = Math.cos(ang) * 0.3;
                    rama.rotation.x = Math.sin(ang) * 0.3;
                    rama.castShadow = true;
                    this.mesh.add(rama);
                }
                
                this.trunk = trunk;
                this.alturaBase = altura;
                
                this.mesh.position.set(this.x, 0, this.z);
            }
            
            actualizarColorEstacional(estacion) {
                if (!this.copa) return;
                
                let color;
                switch(estacion) {
                    case 'spring':
                        color = this.tipo === 'sakura' ? 0xffaacc : 0x8bc34a;
                        break;
                    case 'summer':
                        color = this.tipo === 'sakura' ? 0xffaacc : 0x5f9f5f;
                        break;
                    case 'autumn':
                        color = this.tipo === 'sakura' ? 0xff8844 : 0xff6600;
                        break;
                    case 'winter':
                        color = 0x888888;
                        break;
                }
                
                this.copa.material.color.setHex(color);
                
                if (estacion === 'winter') {
                    this.copa.material.opacity = 0.3;
                    this.copa.material.transparent = true;
                } else {
                    this.copa.material.opacity = 1;
                    this.copa.material.transparent = false;
                }
            }
            
            actualizarCrecimiento(delta, estacion) {
                let factor = 1.0;
                if (estacion === 'spring') factor = 1.3;
                else if (estacion === 'summer') factor = 1.1;
                else if (estacion === 'autumn') factor = 0.6;
                else if (estacion === 'winter') factor = 0.2;
                
                this.edad += delta * this.velocidad * factor;
                if (this.edad > 1) this.edad = 0;
                
                const escala = 0.7 + 0.5 * Math.sin(this.edad * Math.PI * 2);
                
                if (this.trunk && this.copa) {
                    this.trunk.scale.y = escala;
                    this.trunk.position.y = (this.alturaBase / 2) * escala;
                    this.copa.position.y = this.alturaBase * escala + 0.3;
                    this.copa.scale.set(escala, escala, escala);
                }
            }
        }

        // ==================== CREAR PLANTAS DISTRIBUIDAS ====================
        const plantas = [];
        
        // Función para verificar distancia entre puntos
        function distanciaEntrePuntos(x1, z1, x2, z2) {
            return Math.sqrt((x1-x2)*(x1-x2) + (z1-z2)*(z1-z2));
        }
        
        // Generar posiciones para árboles con separación mínima
        const posicionesArboles = [];
        const radioLago = 19;
        const radioMax = 45;
        const separacionMin = 5;
        
        for (let i = 0; i < 80; i++) {
            let intentos = 0;
            let x, z, valida;
            
            do {
                valida = true;
                const ang = Math.random() * Math.PI * 2;
                const radio = radioLago + 2 + Math.random() * (radioMax - radioLago - 2);
                x = Math.cos(ang) * radio;
                z = Math.sin(ang) * radio;
                
                // Verificar separación con otros árboles
                for (const pos of posicionesArboles) {
                    if (distanciaEntrePuntos(x, z, pos.x, pos.z) < separacionMin) {
                        valida = false;
                        break;
                    }
                }
                
                // Verificar que no esté cerca de bancas
                const bancasPos = [
                    [14,10], [16,2], [14,-8], [8,-16], [-2,-18], [-12,-15],
                    [-18,-5], [-19,5], [-15,14], [-5,19], [5,19], [15,15]
                ];
                
                for (const [bx, bz] of bancasPos) {
                    if (distanciaEntrePuntos(x, z, bx, bz) < 4) {
                        valida = false;
                        break;
                    }
                }
                
                intentos++;
                if (intentos > 100) break;
                
            } while (!valida);
            
            if (valida) {
                posicionesArboles.push({ x, z });
                
                let tipo = Math.random() > 0.5 ? 'sakura' : 'normal';
                const planta = new PlantaConTexturas(tipo, x, z, maderaTex, tipo === 'sakura' ? sakuraTex : arbolVerdeTex);
                scene.add(planta.mesh);
                plantas.push(planta);
            }
        }

        // ==================== FLORES Y ARBUSTOS ====================
        // Flores pequeñas alrededor del lago
        for (let i = 0; i < 200; i++) {
            const ang = Math.random() * Math.PI * 2;
            const radio = 16 + Math.random() * 4;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const florGeo = new THREE.SphereGeometry(0.1, 4);
            const coloresFlor = [0xff69b4, 0xffa500, 0xff4d4d, 0x9370db, 0xffd700];
            const florMat = new THREE.MeshStandardMaterial({ 
                color: coloresFlor[Math.floor(Math.random() * coloresFlor.length)]
            });
            const flor = new THREE.Mesh(florGeo, florMat);
            flor.position.set(x, 0.1, z);
            flor.castShadow = true;
            scene.add(flor);
        }
        
        // Arbustos
        for (let i = 0; i < 60; i++) {
            const ang = Math.random() * Math.PI * 2;
            const radio = 18 + Math.random() * 10;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const arbustoGeo = new THREE.SphereGeometry(0.5, 5);
            const arbustoMat = new THREE.MeshStandardMaterial({ 
                map: arbolVerdeTex,
                roughness: 0.7
            });
            const arbusto = new THREE.Mesh(arbustoGeo, arbustoMat);
            arbusto.position.set(x, 0.3, z);
            arbusto.castShadow = true;
            arbusto.receiveShadow = true;
            scene.add(arbusto);
        }

        // ==================== PIEDRAS ====================
        for (let i = 0; i < 60; i++) {
            const ang = Math.random() * Math.PI * 2;
            const radio = 15 + Math.random() * 20;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const piedraGeo = new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.5);
            const piedraMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const piedra = new THREE.Mesh(piedraGeo, piedraMat);
            piedra.position.set(x, 0.1, z);
            piedra.castShadow = true;
            piedra.receiveShadow = true;
            scene.add(piedra);
        }

        // ==================== MONTAÑAS ====================
        for (let m = 0; m < 8; m++) {
            const grupo = new THREE.Group();
            const ang = (m / 8) * Math.PI * 2;
            const radio = 60;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const montañaGeo = new THREE.ConeGeometry(8 + Math.random()*4, 15 + Math.random()*8, 8);
            const montañaMat = new THREE.MeshStandardMaterial({ color: 0x6d4c3d });
            const montaña = new THREE.Mesh(montañaGeo, montañaMat);
            montaña.position.y = 7;
            montaña.castShadow = true;
            grupo.add(montaña);
            
            grupo.position.set(x, -2, z);
            scene.add(grupo);
        }

        // ==================== SISTEMA DE PARTÍCULAS ====================
        const particulas = [];
        
        function crearParticulas(tipo) {
            particulas.forEach(p => scene.remove(p));
            particulas.length = 0;
            
            if (tipo === 'none') return;
            
            const count = tipo === 'nieve' ? 200 : 150;
            
            for (let i = 0; i < count; i++) {
                let geometria, material;
                
                if (tipo === 'nieve') {
                    geometria = new THREE.SphereGeometry(0.1, 4);
                    material = new THREE.MeshStandardMaterial({ 
                        color: 0xffffff,
                        emissive: 0x446688,
                        transparent: true,
                        opacity: 0.8
                    });
                } else if (tipo === 'hojas') {
                    geometria = new THREE.ConeGeometry(0.15, 0.05, 4);
                    material = new THREE.MeshStandardMaterial({ 
                        color: 0xff6600,
                        emissive: 0x442200
                    });
                }
                
                if (geometria && material) {
                    const particula = new THREE.Mesh(geometria, material);
                    particula.position.x = (Math.random() - 0.5) * 80;
                    particula.position.y = 5 + Math.random() * 25;
                    particula.position.z = (Math.random() - 0.5) * 80;
                    
                    particula.userData = {
                        velocidadY: -0.02 - Math.random() * 0.03,
                        rotacion: (Math.random() - 0.5) * 0.1,
                        offsetX: Math.random() * 20,
                        offsetZ: Math.random() * 20
                    };
                    
                    scene.add(particula);
                    particulas.push(particula);
                }
            }
        }

        // ==================== NIEVE EN EL SUELO ====================
        const nieveSuelo = new THREE.Group();
        
        for (let i = 0; i < 150; i++) {
            const ang = Math.random() * Math.PI * 2;
            const radio = 5 + Math.random() * 45;
            const x = Math.cos(ang) * radio;
            const z = Math.sin(ang) * radio;
            
            const nieveGeo = new THREE.SphereGeometry(0.3 + Math.random() * 0.7, 5);
            const nieveMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff,
                emissive: 0x446688,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.9
            });
            const nieve = new THREE.Mesh(nieveGeo, nieveMat);
            nieve.position.set(x, 0.1, z);
            nieve.castShadow = true;
            nieve.receiveShadow = true;
            nieveSuelo.add(nieve);
        }
        
        nieveSuelo.visible = false;
        scene.add(nieveSuelo);

        // ==================== UI Y ESTADOS ====================
        let season = 'spring';
        let timeOfDay = 70;
        
        function actualizarEstacion(estacion) {
            season = estacion;
            
            const emojis = {
                spring: '🌸',
                summer: '☀️',
                autumn: '🍂',
                winter: '❄️'
            };
            document.getElementById('seasonEmoji').textContent = emojis[estacion];
            
            // Color del suelo
            const coloresPasto = {
                spring: 0x8bc34a,
                summer: 0x5f9f5f,
                autumn: 0xcc8844,
                winter: 0xaaaaaa
            };
            ground.material.color.setHex(coloresPasto[estacion]);
            
            // Color de árboles
            plantas.forEach(p => p.actualizarColorEstacional(estacion));
            
            // Partículas
            if (estacion === 'winter') {
                crearParticulas('nieve');
                nieveSuelo.visible = true;
            } else if (estacion === 'autumn') {
                crearParticulas('hojas');
                nieveSuelo.visible = false;
            } else {
                crearParticulas('none');
                nieveSuelo.visible = false;
            }
        }
        
        document.getElementById('springBtn').addEventListener('click', () => {
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('springBtn').classList.add('active');
            actualizarEstacion('spring');
        });
        
        document.getElementById('summerBtn').addEventListener('click', () => {
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('summerBtn').classList.add('active');
            actualizarEstacion('summer');
        });
        
        document.getElementById('autumnBtn').addEventListener('click', () => {
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('autumnBtn').classList.add('active');
            actualizarEstacion('autumn');
        });
        
        document.getElementById('winterBtn').addEventListener('click', () => {
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('winterBtn').classList.add('active');
            actualizarEstacion('winter');
        });
        
        const timeSlider = document.getElementById('timeSlider');
        timeSlider.addEventListener('input', (e) => {
            timeOfDay = parseInt(e.target.value);
        });

        // ==================== ANIMACIÓN PRINCIPAL ====================
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            const tiempo = performance.now() / 1000;
            
            // Actualizar plantas
            plantas.forEach(p => p.actualizarCrecimiento(delta, season));
            
            // Actualizar peces
            peces.forEach(pez => {
                pez.userData.cambioDireccion += (Math.random() - 0.5) * 0.02;
                pez.userData.direccion += pez.userData.cambioDireccion * 0.01;
                
                pez.position.x += Math.cos(pez.userData.direccion) * pez.userData.velocidad;
                pez.position.z += Math.sin(pez.userData.direccion) * pez.userData.velocidad;
                
                const distancia = Math.sqrt(pez.position.x*pez.position.x + pez.position.z*pez.position.z);
                if (distancia > 16) {
                    pez.userData.direccion += Math.PI;
                }
                
                pez.position.y = pez.userData.offsetY + Math.sin(tiempo * pez.userData.frecuencia + pez.position.x) * pez.userData.amplitud;
                pez.rotation.y = pez.userData.direccion;
                pez.rotation.z = Math.sin(tiempo * 2 + pez.position.x) * 0.05;
            });
            
            // Actualizar partículas
            particulas.forEach(p => {
                p.position.y += p.userData.velocidadY;
                p.rotation.y += p.userData.rotacion;
                p.rotation.x += p.userData.rotacion * 0.5;
                
                p.position.x += Math.sin(tiempo + p.userData.offsetX) * 0.01;
                p.position.z += Math.cos(tiempo + p.userData.offsetZ) * 0.01;
                
                if (p.position.y < -2) {
                    p.position.y = 20 + Math.random() * 15;
                    p.position.x = (Math.random() - 0.5) * 70;
                    p.position.z = (Math.random() - 0.5) * 70;
                }
            });
            
            // Efectos de agua realistas
            water.rotation.y += 0.0005;
            ripple.rotation.y += 0.0008;
            water.material.opacity = 0.75 + Math.sin(tiempo * 1.5) * 0.1;
            ripple.material.opacity = 0.35 + Math.sin(tiempo * 2) * 0.1;
            
            // Actualizar luz
            const brightness = timeOfDay / 100;
            sunLight.intensity = 0.3 + brightness * 1.3;
            sunLight.position.x = Math.cos(brightness * Math.PI) * 50;
            sunLight.position.y = Math.sin(brightness * Math.PI) * 40 + 15;
            
            // Color de fondo
            const hue = 0.58 + (brightness - 0.5) * 0.1;
            scene.background.setHSL(hue, 0.6, 0.5 + brightness * 0.2);
            
            // Controles
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            
            const radius = zoom;
            const x = Math.sin(currentRotationY) * Math.cos(currentRotationX) * radius;
            const y = Math.sin(currentRotationX) * radius + 4;
            const z = Math.cos(currentRotationY) * Math.cos(currentRotationX) * radius;
            
            camera.position.set(x, y, z);
            camera.lookAt(0, 1, 0);
            
            // Actualizar contadores
            document.getElementById('fishCount').textContent = peces.length;
            document.getElementById('fishCountDisplay').textContent = peces.length;
            
            renderer.render(scene, camera);
        }
        
        animate();

        // ==================== INICIALIZACIÓN ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateTextureStatus();
        actualizarEstacion('spring');
        
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 3000);
    </script>
</body>
</html>
